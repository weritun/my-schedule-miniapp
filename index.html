<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Моё Расписание</title>
    <!-- Подключаем SDK Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Стили, которые автоматически подстраиваются под тему Telegram */
        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #000000);
            --hint-color: var(--tg-theme-hint-color, #999999);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #f0f0f0);
            --button-color: var(--tg-theme-button-color, #2481cc);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
        }
        body { 
            margin: 0; padding: 16px; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color); color: var(--text-color);
            -webkit-user-select: none; user-select: none;
        }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h1 { font-size: 22px; margin: 0; font-weight: 600; }
        .header .today-btn { 
            background: var(--button-color); color: var(--button-text-color);
            border: none; border-radius: 8px; padding: 8px 16px; font-size: 14px; 
            font-weight: 500; cursor: pointer; 
        }
        .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 20px; }
        .day-name { text-align: center; font-size: 12px; color: var(--hint-color); padding: 8px 0; font-weight: 500; }
        .day { 
            text-align: center; padding: 10px 0; border-radius: 8px; 
            font-size: 14px; cursor: pointer; position: relative;
        }
        .day.today { background: var(--button-color); color: var(--button-text-color); font-weight: 700; }
        .day.has-event::after { 
            content: ''; display: block; width: 4px; height: 4px; 
            background: var(--button-color); border-radius: 50%; 
            position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%);
        }
        .day.today.has-event::after { background: var(--button-text-color); }
        .events-section { margin-top: 20px; }
        .events-section h2 { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
        .event-card { 
            background: var(--secondary-bg); border-radius: 12px; 
            padding: 14px; margin-bottom: 10px; 
        }
        .event-card .time { font-size: 13px; color: var(--hint-color); margin-bottom: 4px; }
        .event-card .title { font-size: 15px; font-weight: 500; line-height: 1.3; }
        .empty { color: var(--hint-color); font-size: 14px; text-align: center; padding: 20px 0; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📅 Моё Расписание</h1>
        <button class="today-btn" onclick="goToToday()">Сегодня</button>
    </div>

    <div class="calendar" id="calendar">
        <!-- Сетка дней будет построена через JS -->
    </div>

    <div class="events-section">
        <h2 id="selectedDateTitle">Сегодня</h2>
        <div id="eventsList">
            <p class="empty">Загрузка...</p>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Применяем тему Telegram
        function applyTheme() {
            document.documentElement.style.setProperty('--bg-color', tg.themeParams.bg_color || '#ffffff');
            document.documentElement.style.setProperty('--text-color', tg.themeParams.text_color || '#000000');
            document.documentElement.style.setProperty('--hint-color', tg.themeParams.hint_color || '#999999');
            document.documentElement.style.setProperty('--secondary-bg', tg.themeParams.secondary_bg_color || '#f0f0f0');
            document.documentElement.style.setProperty('--button-color', tg.themeParams.button_color || '#2481cc');
            document.documentElement.style.setProperty('--button-text-color', tg.themeParams.button_text_color || '#ffffff');
        }
        applyTheme();

        // Демо-данные, чтобы посмотреть, как выглядит календарь
        const demoEvents = {
            "2026-09-24": [
                { time: "10:10–11:45", title: "Основы российской государственности" },
                { time: "12:00–13:35", title: "Возрастная анатомия и физиология" },
                { time: "18:00–19:35", title: "Логика" }
            ],
            "2026-09-25": [
                { time: "12:00–13:35", title: "Алгебра и геометрия" },
                { time: "16:15–17:50", title: "Иностранный язык" }
            ]
        };

        let currentDate = new Date();

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const dayNames = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
            
            const calendarEl = document.getElementById('calendar');
            calendarEl.innerHTML = '';
            
            // Заголовки дней недели
            dayNames.forEach(name => {
                const el = document.createElement('div');
                el.className = 'day-name';
                el.textContent = name;
                calendarEl.appendChild(el);
            });
            
            // Пустые ячейки для выравнивания
            const startOffset = (firstDay === 0 ? 6 : firstDay - 1);
            for (let i = 0; i < startOffset; i++) {
                calendarEl.appendChild(document.createElement('div'));
            }
            
            // Дни месяца
            const today = new Date();
            for (let day = 1; day <= daysInMonth; day++) {
                const el = document.createElement('div');
                el.className = 'day';
                el.textContent = day;
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                
                if (dateStr === today.toISOString().split('T')[0]) el.classList.add('today');
                if (demoEvents[dateStr]) el.classList.add('has-event');
                
                el.onclick = () => selectDate(dateStr);
                calendarEl.appendChild(el);
            }
        }

        function selectDate(dateStr) {
            const [y, m, d] = dateStr.split('-').map(Number);
            const dateObj = new Date(y, m - 1, d);
            const options = { day: 'numeric', month: 'long', weekday: 'long' };
            document.getElementById('selectedDateTitle').textContent = dateObj.toLocaleDateString('ru-RU', options);
            
            const events = demoEvents[dateStr] || [];
            const listEl = document.getElementById('eventsList');
            
            if (events.length === 0) {
                listEl.innerHTML = '<p class="empty">На этот день событий нет</p>';
            } else {
                listEl.innerHTML = events.map(ev => `
                    <div class="event-card">
                        <div class="time">${ev.time}</div>
                        <div class="title">${ev.title}</div>
                    </div>
                `).join('');
            }
        }

        function goToToday() {
            currentDate = new Date();
            renderCalendar();
            selectDate(currentDate.toISOString().split('T')[0]);
        }

        // Инициализация
       
 renderCalendar();
        selectDate(currentDate.toISOString().split('T')[0]);
    </script>
</body>
</html>
