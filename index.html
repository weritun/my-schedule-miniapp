<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Расписание</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --card: var(--tg-theme-secondary-bg-color, #f4f4f7);
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #8a8a8e);
    --accent: var(--tg-theme-button-color, #2481cc);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --shadow: 0 4px 14px rgba(0,0,0,0.06);
    --grad1: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    --grad2: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    --grad3: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
    --grad4: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
    --grad5: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif; }
  body { padding-bottom: 78px; }

  /* HERO */
  .hero {
    padding: 20px 20px 24px;
    background: var(--grad1);
    color: #fff;
    border-radius: 0 0 24px 24px;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: ''; position: absolute; top: -40px; right: -40px;
    width: 160px; height: 160px; border-radius: 50%;
    background: rgba(255,255,255,0.08);
  }
  .hero::after {
    content: ''; position: absolute; bottom: -60px; left: -30px;
    width: 140px; height: 140px; border-radius: 50%;
    background: rgba(255,255,255,0.06);
  }
  .hero-top { display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 1; }
  .hero-greet { font-size: 13px; opacity: 0.85; margin-bottom: 2px; }
  .hero-title { font-size: 22px; font-weight: 700; letter-spacing: -0.4px; }
  .hero-avatar {
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(255,255,255,0.2);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    border: 2px solid rgba(255,255,255,0.35);
  }
  .hero-stats { display: flex; gap: 10px; margin-top: 18px; position: relative; z-index: 1; }
  .hero-stat {
    flex: 1;
    background: rgba(255,255,255,0.15);
    border-radius: 14px;
    padding: 10px 12px;
    backdrop-filter: blur(10px);
  }
  .hero-stat-num { font-size: 20px; font-weight: 800; line-height: 1; }
  .hero-stat-lbl { font-size: 11px; opacity: 0.85; margin-top: 4px; }

  /* TABS */
  .tabs {
    display: flex; gap: 8px;
    padding: 16px 16px 8px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex-shrink: 0;
    padding: 8px 16px;
    border-radius: 100px;
    background: var(--card);
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .tab.active {
    background: var(--accent);
    color: var(--accent-text);
    box-shadow: 0 4px 12px rgba(36,129,204,0.3);
  }

  /* CALENDAR */
  .section { padding: 8px 16px; }
  .month-nav { display: flex; justify-content: space-between; align-items: center; margin: 12px 0; }
  .month-nav .label { font-size: 16px; font-weight: 700; text-transform: capitalize; }
  .month-nav button {
    background: var(--card); border: none; color: var(--text);
    width: 34px; height: 34px; border-radius: 50%;
    font-size: 18px; cursor: pointer; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 6px; }
  .weekday { text-align: center; font-size: 11px; color: var(--hint); font-weight: 600; padding: 6px 0; text-transform: uppercase; letter-spacing: 0.5px; }
  .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .day {
    aspect-ratio: 1;
    display: flex; align-items: center; justify-content: center;
    border-radius: 12px;
    font-size: 14px; font-weight: 500;
    cursor: pointer;
    position: relative;
    transition: all 0.15s;
    color: var(--text);
  }
  .day.other-month { color: var(--hint); opacity: 0.35; }
  .day.today { background: var(--accent); color: var(--accent-text); font-weight: 800; }
  .day.selected:not(.today) { background: var(--card); font-weight: 700; }
  .day.selected:not(.today)::after {
    content: ''; position: absolute; inset: 0;
    border-radius: 12px; border: 2px solid var(--accent);
  }
  .day.has-event:not(.today)::before {
    content: ''; position: absolute; bottom: 4px;
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--accent);
  }
  .day.today.has-event::before {
    content: ''; position: absolute; bottom: 4px;
    width: 5px; height: 5px; border-radius: 50%;
    background: #fff;
  }

  /* EVENTS */
  .events-title {
    font-size: 17px; font-weight: 700;
    margin: 20px 0 12px;
    text-transform: capitalize;
    display: flex; align-items: center; gap: 8px;
  }
  .events-title::before {
    content: ''; width: 4px; height: 18px; border-radius: 2px;
    background: var(--accent);
  }
  .event-card {
    border-radius: 16px;
    padding: 14px 16px;
    margin-bottom: 10px;
    background: var(--card);
    display: flex; gap: 12px;
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
  }
  .event-card::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0;
    width: 4px;
    background: var(--accent);
  }
  .event-card.учёба::before, .event-card.учеба::before { background: linear-gradient(180deg, #667eea, #764ba2); }
  .event-card.транспорт::before { background: linear-gradient(180deg, #f093fb, #f5576c); }
  .event-card.др::before { background: linear-gradient(180deg, #fa709a, #fee140); }
  .event-card.быт::before { background: linear-gradient(180deg, #43e97b, #38f9d7); }
  .event-card.личное::before { background: linear-gradient(180deg, #4facfe, #00f2fe); }
  .event-icon {
    width: 44px; height: 44px; border-radius: 12px;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; flex-shrink: 0;
  }
  .event-body { flex: 1; min-width: 0; }
  .event-time { font-size: 12px; color: var(--hint); font-weight: 700; margin-bottom: 3px; letter-spacing: 0.2px; }
  .event-title { font-size: 15px; font-weight: 600; line-height: 1.3; word-break: break-word; }
  .event-place { font-size: 12px; color: var(--hint); margin-top: 5px; display: flex; align-items: center; gap: 4px; }

  .empty {
    text-align: center; padding: 40px 20px;
    color: var(--hint); font-size: 14px;
  }
  .empty-emoji { font-size: 48px; margin-bottom: 12px; display: block; opacity: 0.6; }
  .loading { text-align: center; padding: 40px; color: var(--hint); font-size: 14px; }
  .error { text-align: center; padding: 24px; color: #e74c3c; font-size: 13px; line-height: 1.5; }

  /* STATS page */
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .stat-card {
    padding: 16px; border-radius: 16px;
    color: #fff; position: relative; overflow: hidden;
    box-shadow: var(--shadow);
  }
  .stat-card.g1 { background: var(--grad1); }
  .stat-card.g2 { background: var(--grad2); }
  .stat-card.g3 { background: var(--grad3); }
  .stat-card.g4 { background: var(--grad4); }
  .stat-num { font-size: 26px; font-weight: 800; line-height: 1; }
  .stat-lbl { font-size: 12px; opacity: 0.9; margin-top: 6px; }

  /* BOTTOM NAV */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--bg);
    border-top: 1px solid var(--card);
    display: flex;
    padding: 8px 0 12px;
    z-index: 100;
    backdrop-filter: blur(20px);
  }
  .nav-item {
    flex: 1;
    text-align: center;
    padding: 6px 0;
    cursor: pointer;
    color: var(--hint);
    transition: color 0.2s;
    font-size: 10px;
    font-weight: 600;
  }
  .nav-item .icon { font-size: 22px; display: block; margin-bottom: 2px; line-height: 1; }
  .nav-item.active { color: var(--accent); }
  .nav-item.active .icon { transform: scale(1.1); }

  .page { display: none; }
  .page.active { display: block; }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-top">
    <div>
      <div class="hero-greet" id="greet">Привет 👋</div>
      <div class="hero-title" id="userName">Моё расписание</div>
    </div>
    <div class="hero-avatar" id="avatar">📅</div>
  </div>
  <div class="hero-stats">
    <div class="hero-stat">
      <div class="hero-stat-num" id="todayCount">—</div>
      <div class="hero-stat-lbl">Сегодня</div>
    </div>
    <div class="hero-stat">
      <div class="hero-stat-num" id="weekCount">—</div>
      <div class="hero-stat-lbl">На неделю</div>
    </div>
    <div class="hero-stat">
      <div class="hero-stat-num" id="totalCount">—</div>
      <div class="hero-stat-lbl">Всего</div>
    </div>
  </div>
</div>

<!-- PAGE: Calendar -->
<div class="page active" id="page-calendar">
  <div class="section">
    <div class="month-nav">
      <button onclick="changeMonth(-1)">‹</button>
      <div class="label" id="monthLabel"></div>
      <button onclick="changeMonth(1)">›</button>
    </div>
    <div class="weekdays">
      <div class="weekday">Пн</div><div class="weekday">Вт</div><div class="weekday">Ср</div>
      <div class="weekday">Чт</div><div class="weekday">Пт</div><div class="weekday">Сб</div>
      <div class="weekday">Вс</div>
    </div>
    <div class="calendar" id="calendar"></div>
    <div class="events-title" id="selectedDateTitle">Сегодня</div>
    <div id="eventsList"><p class="loading">Загрузка...</p></div>
  </div>
</div>

<!-- PAGE: Stats -->
<div class="page" id="page-stats">
  <div class="section">
    <div class="events-title">Статистика</div>
    <div class="stats-grid" id="statsGrid"><p class="loading">Загрузка...</p></div>
  </div>
</div>

<!-- PAGE: Profile -->
<div class="page" id="page-profile">
  <div class="section">
    <div class="events-title">Профиль</div>
    <div id="profileCard"><p class="loading">Загрузка...</p></div>
  </div>
</div>

<div class="bottom-nav">
  <div class="nav-item active" onclick="switchPage('calendar', this)">
    <span class="icon">📅</span>Календарь
  </div>
  <div class="nav-item" onclick="switchPage('stats', this)">
    <span class="icon">📊</span>Статистика
  </div>
  <div class="nav-item" onclick="switchPage('profile', this)">
    <span class="icon">👤</span>Профиль
  </div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

const API_URL = "https://fbf68c07f9972f.lhr.life";

let allEvents = {};
let currentDate = new Date();
let selectedDate = todayStr();
let loadedStats = false;
let loadedProfile = false;

const TYPE_EMOJI = {
  "учёба": "🎓", "учеба": "🎓",
  "транспорт": "🚌",
  "др": "🎂",
  "быт": "🏠",
  "личное": "📝"
};

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function initUser() {
  const u = tg.initDataUnsafe && tg.initDataUnsafe.user;
  if (u) {
    document.getElementById('userName').textContent = u.first_name || 'Пользователь';
    document.getElementById('avatar').textContent = (u.first_name || 'П')[0].toUpperCase();
    const h = new Date().getHours();
    let greet = 'Привет 👋';
    if (h < 6) greet = 'Доброй ночи 🌙';
    else if (h < 12) greet = 'Доброе утро ☀️';
    else if (h < 18) greet = 'Добрый день 🌤';
    else greet = 'Добрый вечер 🌆';
    document.getElementById('greet').textContent = greet;
  }
}

function apiGet(path) {
  const initData = tg.initData || "";
  return fetch(API_URL + path + '?initData=' + encodeURIComponent(initData)).then(r => {
    if (r.status === 401) throw new Error('401');
    return r.json();
  });
}

async function loadEvents() {
  const listEl = document.getElementById('eventsList');
  try {
    const data = await apiGet('/events');
    allEvents = data.events || {};
    renderCalendar();
    renderSelected();
    loadStats();
  } catch (e) {
    listEl.innerHTML = '<p class="error">Не удалось загрузить. Проверь, что бот и туннель работают.</p>';
  }
}

async function loadStats() {
  try {
    const s = await apiGet('/stats');
    document.getElementById('todayCount').textContent = s.today_count || 0;
    document.getElementById('weekCount').textContent = s.week_count || 0;
    document.getElementById('totalCount').textContent = s.total || 0;

    const grid = document.getElementById('statsGrid');
    const labels = {
      "учёба": "Учёба 🎓", "учеба": "Учёба 🎓",
      "транспорт": "Транспорт 🚌",
      "др": "Дни рождения 🎂",
      "быт": "Быт 🏠",
      "личное": "Личное 📝"
    };
    const grads = ['g1','g2','g3','g4'];
    const entries = Object.entries(s.by_type || {});
    if (!entries.length) {
      grid.innerHTML = '<p class="empty"><span class="empty-emoji">📊</span>Пока нет событий</p>';
      return;
    }
    grid.innerHTML = entries.map(([k, v], i) => {
      const lbl = labels[k] || k;
      const g = grads[i % grads.length];
      return '<div class="stat-card ' + g + '"><div class="stat-num">' + v + '</div><div class="stat-lbl">' + lbl + '</div></div>';
    }).join('');
    loadedStats = true;
  } catch (e) {}
}

async function loadProfile() {
  if (loadedProfile) return;
  const el = document.getElementById('profileCard');
  try {
    const p = await apiGet('/profile');
    const proBadge = p.is_pro
      ? '<span style="background:linear-gradient(135deg,#f093fb,#f5576c);color:#fff;padding:2px 10px;border-radius:100px;font-size:11px;font-weight:700;margin-left:8px">PRO ✨</span>'
      : '';
    el.innerHTML = `
      <div style="background:var(--card);border-radius:16px;padding:18px;box-shadow:var(--shadow)">
        <div style="display:flex;align-items:center;gap:14px;margin-bottom:16px">
          <div style="width:56px;height:56px;border-radius:50%;background:var(--grad1);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800">
            ${(tg.initDataUnsafe.user && tg.initDataUnsafe.user.first_name || 'П')[0].toUpperCase()}
          </div>
          <div style="flex:1">
            <div style="font-size:16px;font-weight:700">${(tg.initDataUnsafe.user && tg.initDataUnsafe.user.first_name) || 'Пользователь'}${proBadge}</div>
            <div style="font-size:12px;color:var(--hint);margin-top:2px">ID: ${p.user_id}</div>
          </div>
        </div>
        <div style="border-top:1px solid var(--bg);padding-top:14px">
          <div style="display:flex;justify-content:space-between;padding:6px 0;font-size:14px">
            <span style="color:var(--hint)">Всего событий</span>
            <span style="font-weight:700">${p.total_events}</span>
          </div>
          <div style="display:flex;justify-content:space-between;padding:6px 0;font-size:14px">
            <span style="color:var(--hint)">Тариф</span>
            <span style="font-weight:700">${p.is_pro ? ('PRO · ' + p.days_left + ' дн') : 'Бесплатный'}</span>
          </div>
        </div>
      </div>
    `;
    loadedProfile = true;
  } catch (e) {
    el.innerHTML = '<p class="error">Не удалось загрузить профиль</p>';
  }
}

function renderCalendar() {
  const year = currentDate.getFullYear();
  const month = currentDate.getMonth();
  const monthNames = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  document.getElementById('monthLabel').textContent = monthNames[month] + ' ' + year;

  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const daysInPrev = new Date(year, month, 0).getDate();
  const calendarEl = document.getElementById('calendar');
  calendarEl.innerHTML = '';

  const startOffset = (firstDay === 0 ? 6 : firstDay - 1);
  for (let i = startOffset - 1; i >= 0; i--) {
    const el = document.createElement('div');
    el.className = 'day other-month';
    el.textContent = daysInPrev - i;
    calendarEl.appendChild(el);
  }

  const todayS = todayStr();
  for (let day = 1; day <= daysInMonth; day++) {
    const el = document.createElement('div');
    el.className = 'day';
    el.textContent = day;
    const ds = year + '-' + String(month+1).padStart(2,'0') + '-' + String(day).padStart(2,'0');
    if (ds === todayS) el.classList.add('today');
    if (ds === selectedDate) el.classList.add('selected');
    if (allEvents[ds] && allEvents[ds].length) el.classList.add('has-event');
    (function(dsCopy) {
      el.onclick = function() { selectedDate = dsCopy; renderCalendar(); renderSelected(); };
    })(ds);
    calendarEl.appendChild(el);
  }
}

function renderSelected() {
  const parts = selectedDate.split('-').map(Number);
  const y = parts[0], m = parts[1], d = parts[2];
  const dateObj = new Date(y, m-1, d);
  const options = { day: 'numeric', month: 'long', weekday: 'long' };
  document.getElementById('selectedDateTitle').textContent = dateObj.toLocaleDateString('ru-RU', options);

  const events = allEvents[selectedDate] || [];
  const listEl = document.getElementById('eventsList');
  if (!events.length) {
    listEl.innerHTML = '<p class="empty"><span class="empty-emoji">🍃</span>На этот день ничего нет</p>';
    return;
  }
  listEl.innerHTML = events.map(function(ev) {
    let t = ev.time || 'весь день';
    if (ev.time && ev.end_time) t = ev.time + '–' + ev.end_time;
    const typeKey = (ev.type || '').toLowerCase();
    const emoji = TYPE_EMOJI[typeKey] || '🔹';
    const place = ev.place ? '<div class="event-place">📍 ' + escapeHtml(ev.place) + '</div>' : '';
    return '<div class="event-card ' + escapeHtml(typeKey) + '">' +
      '<div class="event-icon">' + emoji + '</div>' +
      '<div class="event-body">' +
        '<div class="event-time">' + escapeHtml(t) + '</div>' +
        '<div class="event-title">' + escapeHtml(ev.title || '—') + '</div>' +
        place +
      '</div>' +
    '</div>';
  }).join('');
}

function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, function(c) {
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
  });
}

function changeMonth(delta) {
  currentDate.setMonth(currentDate.getMonth() + delta);
  renderCalendar();
}

function switchPage(page, el) {
  document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
  document.querySelectorAll('.nav-item').forEach(function(n) { n.classList.remove('active'); });
  document.getElementById('page-' + page).classList.add('active');
  el.classList.add('active');
  if (page === 'stats' && !loadedStats) loadStats();
  if (page === 'profile') loadProfile();
}

initUser();
loadEvents();
</script>
</body>
</html>
