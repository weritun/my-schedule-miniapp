<!DOCTYPE html>
<html lang="ru" data-theme="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Расписание</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --card: var(--tg-theme-secondary-bg-color, #f4f4f7);
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #8a8a8e);
    --accent: var(--tg-theme-button-color, #2481cc);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --shadow: 0 2px 12px rgba(0,0,0,0.05);
    --border: rgba(0,0,0,0.06);
  }
  html[data-theme="dark"] {
    --bg: #17212b;
    --card: #232e3c;
    --text: #ffffff;
    --hint: #7d8b99;
    --accent: #5288c1;
    --accent-text: #ffffff;
    --shadow: 0 2px 12px rgba(0,0,0,0.25);
    --border: rgba(255,255,255,0.08);
  }
  html[data-theme="light"] {
    --bg: #ffffff;
    --card: #f4f4f7;
    --text: #111111;
    --hint: #8a8a8e;
    --accent: #2481cc;
    --accent-text: #ffffff;
    --shadow: 0 2px 12px rgba(0,0,0,0.05);
    --border: rgba(0,0,0,0.06);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
    padding-bottom: 76px;
    transition: background 0.25s, color 0.25s;
  }

  /* HERO */
  .hero {
    padding: 18px 20px 22px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
    border-radius: 0 0 22px 22px;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: ''; position: absolute; top: -50px; right: -50px;
    width: 180px; height: 180px; border-radius: 50%;
    background: rgba(255,255,255,0.08);
  }
  .hero::after {
    content: ''; position: absolute; bottom: -70px; left: -40px;
    width: 160px; height: 160px; border-radius: 50%;
    background: rgba(255,255,255,0.06);
  }
  .hero-top {
    display: flex; justify-content: space-between; align-items: flex-start;
    position: relative; z-index: 1; margin-bottom: 16px;
  }
  .hero-greet { font-size: 12px; opacity: 0.85; margin-bottom: 3px; }
  .hero-title { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
  .hero-actions { display: flex; gap: 8px; }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 50%;
    background: rgba(255,255,255,0.18);
    border: 1.5px solid rgba(255,255,255,0.3);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 18px; cursor: pointer; padding: 0;
    backdrop-filter: blur(8px);
    transition: transform 0.15s;
  }
  .icon-btn:active { transform: scale(0.92); }
  .avatar {
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(255,255,255,0.25);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 700;
    border: 2px solid rgba(255,255,255,0.4);
    overflow: hidden; flex-shrink: 0;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }

  .hero-stats { display: flex; gap: 8px; position: relative; z-index: 1; }
  .hero-stat {
    flex: 1;
    background: rgba(255,255,255,0.16);
    border-radius: 14px; padding: 10px 12px;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.12);
  }
  .hero-stat-num { font-size: 20px; font-weight: 800; line-height: 1; }
  .hero-stat-lbl { font-size: 11px; opacity: 0.85; margin-top: 4px; }

  /* SECTION */
  .section { padding: 14px 16px; }

  /* MONTH NAV */
  .month-nav {
    display: flex; justify-content: space-between; align-items: center;
    margin: 6px 0 12px;
  }
  .month-nav .label { font-size: 16px; font-weight: 700; text-transform: capitalize; }
  .month-nav button {
    background: var(--card); border: none; color: var(--text);
    width: 36px; height: 36px; border-radius: 50%;
    font-size: 20px; cursor: pointer; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s;
  }
  .month-nav button:active { transform: scale(0.9); }

  /* CALENDAR */
  .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-bottom: 4px; }
  .weekday {
    text-align: center; font-size: 11px; color: var(--hint);
    font-weight: 700; padding: 6px 0; letter-spacing: 0.5px;
  }
  .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .day {
    aspect-ratio: 1;
    display: flex; align-items: center; justify-content: center;
    border-radius: 11px;
    font-size: 14px; font-weight: 500;
    cursor: pointer;
    position: relative;
    color: var(--text);
    transition: background 0.15s, transform 0.1s;
  }
  .day:active { transform: scale(0.94); }
  .day.other-month { color: var(--hint); opacity: 0.35; }
  .day.today {
    background: var(--accent); color: var(--accent-text); font-weight: 800;
  }
  .day.selected:not(.today) {
    background: var(--card); font-weight: 700;
    outline: 2px solid var(--accent); outline-offset: -2px;
  }
  .day.has-event::after {
    content: ''; position: absolute; bottom: 4px;
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--accent);
  }
  .day.today.has-event::after { background: var(--accent-text); }

  /* EVENTS */
  .events-title {
    font-size: 17px; font-weight: 700; margin: 20px 0 12px;
    text-transform: capitalize;
    display: flex; align-items: center; gap: 10px;
  }
  .events-title::before {
    content: ''; width: 4px; height: 18px; border-radius: 2px;
    background: var(--accent);
  }
  .event-card {
    border-radius: 14px;
    padding: 12px 14px;
    margin-bottom: 8px;
    background: var(--card);
    display: flex; gap: 12px;
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .event-card::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0;
    width: 4px; border-radius: 0 4px 4px 0;
    background: var(--accent);
  }
  .event-card.учёба::before, .event-card.учеба::before { background: linear-gradient(180deg, #667eea, #764ba2); }
  .event-card.транспорт::before { background: linear-gradient(180deg, #f093fb, #f5576c); }
  .event-card.др::before { background: linear-gradient(180deg, #fa709a, #fee140); }
  .event-card.быт::before { background: linear-gradient(180deg, #43e97b, #38f9d7); }
  .event-card.личное::before { background: linear-gradient(180deg, #4facfe, #00f2fe); }
  .event-icon {
    width: 42px; height: 42px; border-radius: 11px;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; flex-shrink: 0;
  }
  .event-body { flex: 1; min-width: 0; }
  .event-time { font-size: 11px; color: var(--hint); font-weight: 800; margin-bottom: 3px; letter-spacing: 0.4px; }
  .event-title { font-size: 15px; font-weight: 600; line-height: 1.3; word-break: break-word; }
  .event-place { font-size: 12px; color: var(--hint); margin-top: 5px; }

  /* STATS */
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px; }
  .stat-card {
    padding: 16px; border-radius: 14px;
    color: #fff; position: relative; overflow: hidden;
    box-shadow: var(--shadow);
  }
  .stat-card.g1 { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
  .stat-card.g2 { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
  .stat-card.g3 { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
  .stat-card.g4 { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); }
  .stat-num { font-size: 26px; font-weight: 800; line-height: 1; }
  .stat-lbl { font-size: 12px; opacity: 0.9; margin-top: 6px; }

  /* PROFILE */
  .profile-card {
    background: var(--card); border-radius: 16px;
    padding: 18px; box-shadow: var(--shadow);
    border: 1px solid var(--border);
  }
  .profile-head { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .profile-avatar {
    width: 60px; height: 60px; border-radius: 50%;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 800; color: #fff;
    overflow: hidden; flex-shrink: 0;
  }
  .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .profile-name { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .profile-id { font-size: 12px; color: var(--hint); margin-top: 3px; }
  .pro-badge {
    background: linear-gradient(135deg, #f093fb, #f5576c);
    color: #fff; padding: 2px 10px; border-radius: 100px;
    font-size: 11px; font-weight: 800;
  }
  .profile-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 9px 0; font-size: 14px;
    border-top: 1px solid var(--border);
  }
  .profile-row .label { color: var(--hint); }
  .profile-row .value { font-weight: 700; }

  /* EMPTY */
  .empty { text-align: center; padding: 40px 20px; color: var(--hint); font-size: 14px; }
  .empty-emoji { font-size: 46px; margin-bottom: 10px; display: block; opacity: 0.7; }
  .loading { text-align: center; padding: 40px; color: var(--hint); font-size: 14px; }
  .error { text-align: center; padding: 24px; color: #e74c3c; font-size: 13px; line-height: 1.5; }

  /* BOTTOM NAV */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--bg);
    border-top: 1px solid var(--border);
    display: flex;
    padding: 8px 0 14px;
    z-index: 100;
  }
  .nav-item {
    flex: 1; text-align: center;
    padding: 4px 0; cursor: pointer;
    color: var(--hint);
    font-size: 10px; font-weight: 700;
    transition: color 0.2s, transform 0.15s;
  }
  .nav-item:active { transform: scale(0.94); }
  .nav-item .icon { font-size: 22px; display: block; margin-bottom: 2px; line-height: 1; }
  .nav-item.active { color: var(--accent); }

  .page { display: none; }
  .page.active { display: block; }

  /* THEME MODAL */
  .modal {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.5); z-index: 200;
    align-items: flex-end; justify-content: center;
  }
  .modal.show { display: flex; }
  .modal-body {
    background: var(--bg); width: 100%;
    border-radius: 20px 20px 0 0;
    padding: 20px 20px 30px;
    color: var(--text);
  }
  .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; }
  .theme-option {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; border-radius: 12px;
    background: var(--card); margin-bottom: 8px;
    cursor: pointer; font-size: 14px; font-weight: 600;
    transition: transform 0.15s;
  }
  .theme-option:active { transform: scale(0.98); }
  .theme-option.active { outline: 2px solid var(--accent); }
  .theme-option .check { color: var(--accent); font-weight: 800; }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-top">
    <div style="display:flex;align-items:center;gap:12px">
      <div class="avatar" id="avatar">?</div>
      <div>
        <div class="hero-greet" id="greet">Привет 👋</div>
        <div class="hero-title" id="userName">Моё расписание</div>
      </div>
    </div>
    <div class="hero-actions">
      <button class="icon-btn" onclick="openThemeModal()" title="Тема">🎨</button>
    </div>
  </div>
  <div class="hero-stats">
    <div class="hero-stat">
      <div class="hero-stat-num" id="todayCount">—</div>
      <div class="hero-stat-lbl">Сегодня</div>
    </div>
    <div class="hero-stat">
      <div class="hero-stat-num" id="weekCount">—</div>
      <div class="hero-stat-lbl">На неделю</div>
    </div>
    <div class="hero-stat">
      <div class="hero-stat-num" id="totalCount">—</div>
      <div class="hero-stat-lbl">Всего</div>
    </div>
  </div>
</div>

<div class="page active" id="page-calendar">
  <div class="section">
    <div class="month-nav">
      <button onclick="changeMonth(-1)">‹</button>
      <div class="label" id="monthLabel"></div>
      <button onclick="changeMonth(1)">›</button>
    </div>
    <div class="weekdays">
      <div class="weekday">ПН</div><div class="weekday">ВТ</div><div class="weekday">СР</div>
      <div class="weekday">ЧТ</div><div class="weekday">ПТ</div><div class="weekday">СБ</div>
      <div class="weekday">ВС</div>
    </div>
    <div class="calendar" id="calendar"></div>
    <div class="events-title" id="selectedDateTitle">Сегодня</div>
    <div id="eventsList"><p class="loading">Загрузка...</p></div>
  </div>
</div>

<div class="page" id="page-stats">
  <div class="section">
    <div class="events-title">Статистика</div>
    <div class="stats-grid" id="statsGrid"><p class="loading">Загрузка...</p></div>
  </div>
</div>

<div class="page" id="page-profile">
  <div class="section">
    <div class="events-title">Профиль</div>
    <div id="profileCard"><p class="loading">Загрузка...</p></div>
  </div>
</div>

<div class="bottom-nav">
  <div class="nav-item active" onclick="switchPage('calendar', this)">
    <span class="icon">📅</span>Календарь
  </div>
  <div class="nav-item" onclick="switchPage('stats', this)">
    <span class="icon">📊</span>Статистика
  </div>
  <div class="nav-item" onclick="switchPage('profile', this)">
    <span class="icon">👤</span>Профиль
  </div>
</div>

<div class="modal" id="themeModal" onclick="closeThemeModal(event)">
  <div class="modal-body" onclick="event.stopPropagation()">
    <div class="modal-title">Выбор темы</div>
    <div class="theme-option" data-theme="auto" onclick="setTheme('auto')">
      <span>🌗 Как в Telegram</span><span class="check"></span>
    </div>
    <div class="theme-option" data-theme="light" onclick="setTheme('light')">
      <span>☀️ Светлая</span><span class="check"></span>
    </div>
    <div class="theme-option" data-theme="dark" onclick="setTheme('dark')">
      <span>🌙 Тёмная</span><span class="check"></span>
    </div>
  </div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();


  //МОЙ КЛЮЧ ТУТ


  
const API_URL = "https://weritun.serveousercontent.com";





  
const TYPE_EMOJI = {
  "учёба": "🎓", "учеба": "🎓",
  "транспорт": "🚌",
  "др": "🎂",
  "быт": "🏠",
  "личное": "📝"
};

let allEvents = {};
let currentDate = new Date();
let selectedDate = todayStr();
let loadedStats = false;
let loadedProfile = false;

/* === THEME === */
function applyTheme(theme) {
  if (theme === 'auto') {
    const isDark = tg.colorScheme === 'dark';
    document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
  } else {
    document.documentElement.setAttribute('data-theme', theme);
  }
  document.querySelectorAll('.theme-option').forEach(function(el) {
    el.classList.toggle('active', el.getAttribute('data-theme') === theme);
  });
}

function setTheme(theme) {
  localStorage.setItem('theme', theme);
  applyTheme(theme);
  closeThemeModal();
}

function openThemeModal() {
  const current = localStorage.getItem('theme') || 'auto';
  document.querySelectorAll('.theme-option').forEach(function(el) {
    el.classList.toggle('active', el.getAttribute('data-theme') === current);
  });
  document.getElementById('themeModal').classList.add('show');
}

function closeThemeModal(e) {
  if (e && e.target !== e.currentTarget && e.type === 'click') return;
  document.getElementById('themeModal').classList.remove('show');
}

/* === USER === */
function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function initUser() {
  const u = tg.initDataUnsafe && tg.initDataUnsafe.user;
  if (!u) return;
  const name = u.first_name || 'Пользователь';
  document.getElementById('userName').textContent = name;

  const avatarEl = document.getElementById('avatar');
  if (u.photo_url) {
    avatarEl.innerHTML = '<img src="' + u.photo_url + '" alt="">';
  } else {
    avatarEl.textContent = name[0].toUpperCase();
  }

  const h = new Date().getHours();
  let greet = 'Привет 👋';
  if (h < 6) greet = 'Доброй ночи 🌙';
  else if (h < 12) greet = 'Доброе утро ☀️';
  else if (h < 18) greet = 'Добрый день 🌤';
  else greet = 'Добрый вечер 🌆';
  document.getElementById('greet').textContent = greet;
}

/* === API === */
function apiGet(path) {
  const initData = tg.initData || "";
  return fetch(API_URL + path + '?initData=' + encodeURIComponent(initData)).then(function(r) {
    if (r.status === 401) throw new Error('401');
    return r.json();
  });
}

async function loadEvents() {
  const listEl = document.getElementById('eventsList');
  try {
    const data = await apiGet('/events');
    allEvents = data.events || {};
    renderCalendar();
    renderSelected();
    loadStats();
  } catch (e) {
    listEl.innerHTML = '<p class="error">Не удалось загрузить. Проверь, что бот и туннель работают.</p>';
  }
}

async function loadStats() {
  try {
    const s = await apiGet('/stats');
    document.getElementById('todayCount').textContent = s.today_count || 0;
    document.getElementById('weekCount').textContent = s.week_count || 0;
    document.getElementById('totalCount').textContent = s.total || 0;

    const grid = document.getElementById('statsGrid');
    const labels = {
      "учёба": "Учёба", "учеба": "Учёба",
      "транспорт": "Транспорт",
      "др": "Дни рождения",
      "быт": "Быт",
      "личное": "Личное"
    };
    const emojis = {"учёба":"🎓","учеба":"🎓","транспорт":"🚌","др":"🎂","быт":"🏠","личное":"📝"};
    const grads = ['g1','g2','g3','g4'];
    const entries = Object.entries(s.by_type || {});
    if (!entries.length) {
      grid.innerHTML = '<p class="empty"><span class="empty-emoji">📊</span>Пока нет событий</p>';
      return;
    }
    grid.innerHTML = entries.map(function(e, i) {
      const k = e[0], v = e[1];
      const lbl = labels[k] || k;
      const em = emojis[k] || '🔹';
      return '<div class="stat-card ' + grads[i % grads.length] + '">' +
        '<div class="stat-num">' + v + '</div>' +
        '<div class="stat-lbl">' + em + ' ' + lbl + '</div></div>';
    }).join('');
    loadedStats = true;
  } catch (e) {}
}

async function loadProfile() {
  if (loadedProfile) return;
  const el = document.getElementById('profileCard');
  try {
    const p = await apiGet('/profile');
    const u = tg.initDataUnsafe && tg.initDataUnsafe.user || {};
    const name = u.first_name || 'Пользователь';
    const proBadge = p.is_pro ? '<span class="pro-badge">PRO ✨</span>' : '';
    const avatarContent = u.photo_url
      ? '<img src="' + u.photo_url + '" alt="">'
      : name[0].toUpperCase();
    el.innerHTML =
      '<div class="profile-card">' +
        '<div class="profile-head">' +
          '<div class="profile-avatar">' + avatarContent + '</div>' +
          '<div style="flex:1;min-width:0">' +
            '<div class="profile-name">' + name + proBadge + '</div>' +
            '<div class="profile-id">ID: ' + p.user_id + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="profile-row"><span class="label">Всего событий</span><span class="value">' + p.total_events + '</span></div>' +
        '<div class="profile-row"><span class="label">Тариф</span><span class="value">' + (p.is_pro ? ('PRO · ' + p.days_left + ' дн') : 'Бесплатный') + '</span></div>' +
      '</div>';
    loadedProfile = true;
  } catch (e) {
    el.innerHTML = '<p class="error">Не удалось загрузить профиль</p>';
  }
}

/* === CALENDAR === */
function renderCalendar() {
  const year = currentDate.getFullYear();
  const month = currentDate.getMonth();
  const monthNames = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  document.getElementById('monthLabel').textContent = monthNames[month] + ' ' + year;

  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const daysInPrev = new Date(year, month, 0).getDate();
  const calendarEl = document.getElementById('calendar');
  calendarEl.innerHTML = '';

  const startOffset = (firstDay === 0 ? 6 : firstDay - 1);
  for (let i = startOffset - 1; i >= 0; i--) {
    const el = document.createElement('div');
    el.className = 'day other-month';
    el.textContent = daysInPrev - i;
    calendarEl.appendChild(el);
  }

  const todayS = todayStr();
  for (let day = 1; day <= daysInMonth; day++) {
    const el = document.createElement('div');
    el.className = 'day';
    el.textContent = day;
    const ds = year + '-' + String(month+1).padStart(2,'0') + '-' + String(day).padStart(2,'0');
    if (ds === todayS) el.classList.add('today');
    if (ds === selectedDate) el.classList.add('selected');
    if (allEvents[ds] && allEvents[ds].length) el.classList.add('has-event');
    (function(dsCopy) {
      el.onclick = function() { selectedDate = dsCopy; renderCalendar(); renderSelected(); };
    })(ds);
    calendarEl.appendChild(el);
  }
}

function renderSelected() {
  const parts = selectedDate.split('-').map(Number);
  const y = parts[0], m = parts[1], d = parts[2];
  const dateObj = new Date(y, m-1, d);
  const options = { day: 'numeric', month: 'long', weekday: 'long' };
  document.getElementById('selectedDateTitle').textContent = dateObj.toLocaleDateString('ru-RU', options);

  const events = allEvents[selectedDate] || [];
  const listEl = document.getElementById('eventsList');
  if (!events.length) {
    listEl.innerHTML = '<p class="empty"><span class="empty-emoji">🍃</span>На этот день ничего нет</p>';
    return;
  }
  listEl.innerHTML = events.map(function(ev) {
    let t = ev.time || 'весь день';
    if (ev.time && ev.end_time) t = ev.time + '–' + ev.end_time;
    const typeKey = (ev.type || '').toLowerCase();
    const emoji = TYPE_EMOJI[typeKey] || '🔹';
    const place = ev.place ? '<div class="event-place">📍 ' + escapeHtml(ev.place) + '</div>' : '';
    return '<div class="event-card ' + escapeHtml(typeKey) + '">' +
      '<div class="event-icon">' + emoji + '</div>' +
      '<div class="event-body">' +
        '<div class="event-time">' + escapeHtml(t) + '</div>' +
        '<div class="event-title">' + escapeHtml(ev.title || '—') + '</div>' +
        place +
      '</div>' +
    '</div>';
  }).join('');
}

function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, function(c) {
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
  });
}

function changeMonth(delta) {
  currentDate.setMonth(currentDate.getMonth() + delta);
  renderCalendar();
}

function switchPage(page, el) {
  document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
  document.querySelectorAll('.nav-item').forEach(function(n) { n.classList.remove('active'); });
  document.getElementById('page-' + page).classList.add('active');
  el.classList.add('active');
  if (page === 'stats' && !loadedStats) loadStats();
  if (page === 'profile') loadProfile();
}

/* === INIT === */
(function init() {
  const savedTheme = localStorage.getItem('theme') || 'auto';
  applyTheme(savedTheme);

  tg.onEvent('themeChanged', function() {
    const t = localStorage.getItem('theme') || 'auto';
    if (t === 'auto') applyTheme('auto');
  });

  initUser();
  loadEvents();
})();
</script>
