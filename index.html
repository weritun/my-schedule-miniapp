<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Моё Расписание</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #000000);
            --hint-color: var(--tg-theme-hint-color, #999999);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #f0f0f0);
            --button-color: var(--tg-theme-button-color, #2481cc);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --accent: #e76f51;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color); color: var(--text-color);
            -webkit-user-select: none; user-select: none;
        }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .header h1 { font-size: 20px; margin: 0; font-weight: 600; }
        .header .today-btn {
            background: var(--button-color); color: var(--button-text-color);
            border: none; border-radius: 8px; padding: 8px 14px; font-size: 13px;
            font-weight: 500; cursor: pointer;
        }
        .month-nav {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px; padding: 0 4px;
        }
        .month-nav .label { font-size: 15px; font-weight: 600; text-transform: capitalize; }
        .month-nav button {
            background: transparent; border: none; color: var(--button-color);
            font-size: 22px; cursor: pointer; padding: 4px 12px; font-weight: 700;
        }
        .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 20px; }
        .day-name { text-align: center; font-size: 12px; color: var(--hint-color); padding: 8px 0; font-weight: 500; }
        .day { text-align: center; padding: 10px 0; border-radius: 8px; font-size: 14px; cursor: pointer; position: relative; }
        .day.other-month { color: var(--hint-color); opacity: 0.4; }
        .day.today { background: var(--button-color); color: var(--button-text-color); font-weight: 700; }
        .day.selected { outline: 2px solid var(--button-color); }
        .day.has-event::after {
            content: ''; display: block; width: 5px; height: 5px;
            background: var(--accent); border-radius: 50%;
            position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%);
        }
        .day.today.has-event::after { background: var(--button-text-color); }
        .events-section { margin-top: 8px; }
        .events-section h2 { font-size: 15px; font-weight: 600; margin: 0 0 12px 0; text-transform: capitalize; }
        .event-card {
            background: var(--secondary-bg); border-radius: 12px;
            padding: 12px 14px; margin-bottom: 8px;
            border-left: 3px solid var(--button-color);
        }
        .event-card .time { font-size: 12px; color: var(--hint-color); margin-bottom: 4px; font-weight: 600; }
        .event-card .title { font-size: 15px; font-weight: 500; line-height: 1.3; }
        .event-card .place { font-size: 12px; color: var(--hint-color); margin-top: 6px; }
        .empty { color: var(--hint-color); font-size: 14px; text-align: center; padding: 24px 0; }
        .error { color: #cc4444; font-size: 13px; text-align: center; padding: 20px; line-height: 1.5; }
        .loading { color: var(--hint-color); font-size: 14px; text-align: center; padding: 24px 0; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📅 Моё Расписание</h1>
        <button class="today-btn" onclick="goToToday()">Сегодня</button>
    </div>
    <div class="month-nav">
        <button onclick="changeMonth(-1)">‹</button>
        <div class="label" id="monthLabel"></div>
        <button onclick="changeMonth(1)">›</button>
    </div>
    <div class="calendar" id="calendar"></div>
    <div class="events-section">
        <h2 id="selectedDateTitle">Сегодня</h2>
        <div id="eventsList"><p class="loading">Загрузка...</p></div>
    </div>
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const API_URL = "https://80ffa49141af48.lhr.life";

        let allEvents = {};
        let currentDate = new Date();
        let selectedDate = todayStr();

        function todayStr() {
            const d = new Date();
            return d.getFullYear() + '-' +
                String(d.getMonth() + 1).padStart(2, '0') + '-' +
                String(d.getDate()).padStart(2, '0');
        }

        function applyTheme() {
            const p = tg.themeParams || {};
            document.documentElement.style.setProperty('--bg-color', p.bg_color || '#ffffff');
            document.documentElement.style.setProperty('--text-color', p.text_color || '#000000');
            document.documentElement.style.setProperty('--hint-color', p.hint_color || '#999999');
            document.documentElement.style.setProperty('--secondary-bg', p.secondary_bg_color || '#f0f0f0');
            document.documentElement.style.setProperty('--button-color', p.button_color || '#2481cc');
            document.documentElement.style.setProperty('--button-text-color', p.button_text_color || '#ffffff');
        }
        applyTheme();

        async function loadEvents() {
            const listEl = document.getElementById('eventsList');
            listEl.innerHTML = '<p class="loading">Загрузка...</p>';
            try {
                const initData = tg.initData || "";
                const url = API_URL + "/events?initData=" + encodeURIComponent(initData);
                const resp = await fetch(url);
                if (resp.status === 401) {
                    listEl.innerHTML = '<p class="error">Открой календарь через бота — без авторизации Telegram доступ закрыт.</p>';
                    return;
                }
                if (!resp.ok) {
                    listEl.innerHTML = '<p class="error">Ошибка сервера: ' + resp.status + '</p>';
                    return;
                }
                const data = await resp.json();
                allEvents = data.events || {};
                renderCalendar();
                renderSelected();
            } catch (e) {
                listEl.innerHTML = '<p class="error">Не удалось загрузить события.<br>Проверь, что бот и туннель запущены.<br><small>' + e.message + '</small></p>';
            }
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const monthNames = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
            document.getElementById('monthLabel').textContent = monthNames[month] + ' ' + year;
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const daysInPrev = new Date(year, month, 0).getDate();
            const dayNames = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
            const calendarEl = document.getElementById('calendar');
            calendarEl.innerHTML = '';
            dayNames.forEach(function(name) {
                const el = document.createElement('div');
                el.className = 'day-name';
                el.textContent = name;
                calendarEl.appendChild(el);
            });
            const startOffset = (firstDay === 0 ? 6 : firstDay - 1);
            for (let i = startOffset - 1; i >= 0; i--) {
                const el = document.createElement('div');
                el.className = 'day other-month';
                el.textContent = daysInPrev - i;
                calendarEl.appendChild(el);
            }
            const todayS = todayStr();
            for (let day = 1; day <= daysInMonth; day++) {
                const el = document.createElement('div');
                el.className = 'day';
                el.textContent = day;
                const ds = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(day).padStart(2, '0');
                if (ds === todayS) el.classList.add('today');
                if (ds === selectedDate) el.classList.add('selected');
                if (allEvents[ds] && allEvents[ds].length) el.classList.add('has-event');
                (function(dsCopy) {
                    el.onclick = function() { selectedDate = dsCopy; renderCalendar(); renderSelected(); };
                })(ds);
                calendarEl.appendChild(el);
            }
        }

        function renderSelected() {
            const parts = selectedDate.split('-').map(Number);
            const y = parts[0], m = parts[1], d = parts[2];
            const dateObj = new Date(y, m - 1, d);
            const options = { day: 'numeric', month: 'long', weekday: 'long' };
            document.getElementById('selectedDateTitle').textContent = dateObj.toLocaleDateString('ru-RU', options);
            const events = allEvents[selectedDate] || [];
            const listEl = document.getElementById('eventsList');
            if (!events.length) {
                listEl.innerHTML = '<p class="empty">На этот день событий нет</p>';
                return;
            }
            listEl.innerHTML = events.map(function(ev) {
                let t = ev.time || 'весь день';
                if (ev.time && ev.end_time) t = ev.time + '–' + ev.end_time;
                const place = ev.place ? '<div class="place">📍 ' + escapeHtml(ev.place) + '</div>' : '';
                return '<div class="event-card">' +
                    '<div class="time">' + escapeHtml(t) + '</div>' +
                    '<div class="title">' + escapeHtml(ev.title || '—') + '</div>' +
                    place + '</div>';
            }).join('');
        }

        function escapeHtml(s) {
            if (s === null || s === undefined) return '';
            return String(s).replace(/[&<>"']/g, function(c) {
                return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
            });
        }

        function changeMonth(delta) {
            currentDate.setMonth(currentDate.getMonth() + delta);
            renderCalendar();
        }

        function goToToday() {
            currentDate = new Date();
            selectedDate = todayStr();
            renderCalendar();
            renderSelected();
        }

        loadEvents();
    </script>
</body>
</html>
